<div class="modal fade" id="passwordResetModal" tabindex="-1" aria-labelledby="passwordResetTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="passwordResetTitle">Reset Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>This link expires in 12 hours and can be used once. Generating a new link replaces the previous one.</p>
        <div id="passwordResetStatus" role="status" aria-live="polite"></div>
        <div id="passwordResetResult" hidden>
          <label for="passwordResetUrl" class="form-label">Password reset link</label>
          <input id="passwordResetUrl" class="form-control" type="text" readonly>
          <p id="passwordResetExpiry" class="small text-muted mt-2"></p>
          <div class="d-flex gap-2">
            <a id="passwordResetOpen" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Open Link</a>
            <button id="passwordResetCopy" class="btn btn-outline-secondary" type="button">Copy Link</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const modal = document.getElementById('passwordResetModal');
  const status = document.getElementById('passwordResetStatus');
  const result = document.getElementById('passwordResetResult');
  const input = document.getElementById('passwordResetUrl');
  const open = document.getElementById('passwordResetOpen');
  let generation = 0;
  modal.addEventListener('hidden.bs.modal', () => { generation++; });
  window.openResetModal = async function(userId) {
    const current = ++generation;
    result.hidden = true;
    input.value = '';
    open.removeAttribute('href');
    status.textContent = 'Creating reset link…';
    bootstrap.Modal.getOrCreateInstance(modal).show();
    try {
      const response = await fetch('/admin/reset/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: userId})
      });
      const data = await response.json();
      if (current !== generation) return;
      if (!response.ok || data.status !== 'success') throw new Error(data.message || 'Unable to create reset link.');
      input.value = data.reset_url;
      open.href = data.reset_url;
      document.getElementById('passwordResetExpiry').textContent = 'Expires: ' + new Date(data.expires_at).toLocaleString();
      result.hidden = false;
      status.textContent = '';
    } catch (error) {
      if (current === generation) status.textContent = error.message || 'Unable to create reset link. Please try again.';
    }
  };
  document.getElementById('passwordResetCopy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(input.value);
      status.textContent = 'Link copied.';
    } catch (error) {
      input.focus();
      input.select();
      status.textContent = document.execCommand('copy') ? 'Link copied.' : 'Select and copy the link above.';
    }
  });
})();
</script>
